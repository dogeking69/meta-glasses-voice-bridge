# Copy this file to config.toml and edit it. config.toml is gitignored.

[server]
# 0.0.0.0 = listen on all network interfaces so your phone can reach this Mac.
# Change to "127.0.0.1" to allow only this computer (useful for testing).
host = "0.0.0.0"
port = 8765

[auth]
# Shared secret. Generate one with:  python3 -c "import secrets; print(secrets.token_hex(32))"
# Paste the SAME value into the iOS app's Settings screen.
shared_secret = "CHANGE-ME"
# Requests older than this many seconds are rejected (blocks replay attacks).
max_skew_seconds = 60

[claude]
# Path to the Claude Code CLI. Uses your Claude subscription, not an API key.
# Leave as "claude" if it is on your PATH; otherwise run `which claude` and paste
# the full path here.
binary = "claude"
model = "sonnet"
timeout_seconds = 60

[confirm]
# Actions that are read back to you out loud and only run once you say "yes".
# Anything listed here can never be triggered by a single misheard sentence.
require = ["claude_code"]
# How long a pending confirmation stays valid.
timeout_seconds = 180

[actions.open_app]
# Only these apps can be opened. Keys are what you SAY, values are the real app name.
# Add more as you need them.
spotify = "Spotify"
music = "Music"
safari = "Safari"
notes = "Notes"
messages = "Messages"
mail = "Mail"
calendar = "Calendar"
terminal = "Terminal"
finder = "Finder"

# Voice-triggered coding work. Only these folders can ever be worked on, so a
# misheard path cannot send Claude somewhere unexpected. Keys are what you SAY.
[actions.claude_code.projects]
apex-sky = "~/Documents/claude/ApexSky-RunwayPath"
apex-sky-aso = "~/Documents/claude/apex-sky-aso"
stratosphere-explorer = "~/Documents/Codex/2026-05-15/files-mentioned-by-the-user-stratosphere/stratosphere-explorer-final"

[actions.claude_code.settings]
# What Claude Code may do inside those folders. It can read and edit files and
# run commands, but pushing, deleting and sudo are blocked outright.
allowed_tools = "Read Edit Write Glob Grep Bash"
disallowed_tools = "Bash(git push:*) Bash(rm:*) Bash(sudo:*) Bash(curl:*)"
# Coding tasks take longer than a question.
timeout_seconds = 600
